<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratoire Alchimique - Grimoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Inter:wght@300;400;500&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/variables.css?v=4">
    <link rel="stylesheet" href="/styles/ui/layout.css?v=4">
    <link rel="stylesheet" href="/styles/ui/forms.css?v=4">
    <link rel="stylesheet" href="/styles/ui/components.css?v=4">
    <link rel="stylesheet" href="/styles/ui/utilities.css">
    <link rel="stylesheet" href="/styles/pages/alchemy.css?v=1">
</head>

<body>

    <app-navbar active-page="alchemy"></app-navbar>

    <main style="display: block;">
        <div class="alchemy-main"
            style="max-width: 1400px; margin: 2rem auto; flex-direction: row; gap: 2rem; align-items: stretch; justify-content: center; height: calc(100vh - 160px);">

            <!-- Left: List of recipes -->
            <div class="panel" style="flex: 1; max-width: 450px; display: flex; flex-direction: column;">
                <div class="panel-title">
                    <span class="material-symbols-outlined" style="color: #a855f7;">menu_book</span>
                    Recettes Alchimique
                </div>

                <div class="filters-container" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <div style="flex: 1;">
                        <input type="text" id="searchRecipeName" class="form-control"
                            placeholder="Rechercher par nom..." style="margin: 0; padding: 0.6rem; font-size: 0.85rem;"
                            oninput="renderRecipesList()">
                    </div>
                    <div class="custom-select-wrapper" style="flex: 1; z-index: 20;">
                        <div class="custom-select-trigger">
                            <span class="cs-label" style="font-size: 0.85rem;">Recettes</span>
                            <span class="material-symbols-outlined"
                                style="color: #64748b; font-size: 1rem;">expand_more</span>
                        </div>
                        <div class="custom-select-options custom-options">
                            <div class="custom-option" data-value="">
                                <span class="material-symbols-outlined cs-icon text-muted">filter_list_off</span>
                                Recettes
                            </div>
                            <div class="custom-option" data-value="GIVE_ANOMALY">
                                <span class="material-symbols-outlined cs-icon text-purple">star</span> Anomalie
                            </div>
                            <div class="custom-option" data-value="GIVE_CONSUMABLE">
                                <span class="material-symbols-outlined cs-icon text-success">inventory_2</span>
                                Consommable
                            </div>
                            <div class="custom-option" data-value="GIVE_EQUIPMENT">
                                <span class="material-symbols-outlined cs-icon text-warning">shield</span> Equipement
                            </div>
                            <div class="custom-option" data-value="UNLOCK_FEATURE">
                                <span class="material-symbols-outlined cs-icon text-warning">key</span> Secret
                            </div>
                            <div class="custom-option" data-value="GIVE_SPIRIT_XP">
                                <span class="material-symbols-outlined cs-icon text-mana">self_improvement</span> XP
                                Spiritualité
                            </div>
                        </div>
                        <input type="hidden" id="filterRewardType" value="" onchange="renderRecipesList()">
                    </div>
                </div>
                <div id="playerRecipesList" class="custom-scrollbar"
                    style="display: flex; flex-direction: column; gap: 1rem; flex: 1; overflow-y: auto; padding-right: 0.5rem;">
                    <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Chargement du Grimoire
                        Alchimique...</p>
                </div>
            </div>

            <!-- Right: The Cauldron / Crafting Area -->
            <div class="alchemy-panel"
                style="flex: 2; display: flex; justify-content: center; align-items: center; min-height: 500px;"
                id="cauldronPanel">
                <div style="text-align: center; color: var(--text-muted);">
                    <span class="material-symbols-outlined"
                        style="font-size: 4rem; color: rgba(16, 185, 129, 0.3);">experiment</span>
                    <p style="margin-top: 1rem;">Sélectionnez une recette dans le grimoire à gauche pour l'étudier.</p>
                </div>
            </div>

        </div>

    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/alchemy.js"></script>
    <script src="/js/components/navbar.js"></script>


</body>

</html>
