<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratoire Alchimique - Grimoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="/styles/variables.css?v=4">
    <link rel="stylesheet" href="/styles/ui/layout.css?v=4">
    <link rel="stylesheet" href="/styles/ui/forms.css?v=4">
    <link rel="stylesheet" href="/styles/ui/components.css?v=4">
    <link rel="stylesheet" href="/styles/ui/utilities.css">
    <style>
        .alchemy-main {
            padding: 2rem 5%;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }

        @keyframes pulseCraftable {
            0% { box-shadow: 0 0 4px 0 rgba(16, 185, 129, 0.1); }
            50% { box-shadow: 0 0 16px 2px rgba(16, 185, 129, 0.5); }
            100% { box-shadow: 0 0 4px 0 rgba(16, 185, 129, 0.1); }
        }

        .craftable-pulse {
            animation: pulseCraftable 3s ease-in-out infinite;
        }

        .alchemy-title {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 1rem;
            text-shadow: 0 4px 30px rgba(16, 185, 129, 0.3);
            margin-top: 2rem;
        }

        .alchemy-title .material-symbols-outlined {
            font-size: 3rem;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-transmute {
            position: relative;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            color: white;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.2);
            /* On ne cible que le mouvement et l'ombre en rapide (0.3s) */
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1),
                box-shadow 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
            z-index: 1;
        }

        .btn-transmute::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #06b6d4, #10b981);
            opacity: 0;
            z-index: -1;
            border-radius: 50px;
            /* L'astuce anti-flash est ici : */
            pointer-events: none;
            /* On ralentit uniquement le fondu du dégradé (1s) */
            transition: opacity 1s ease-in-out;
        }

        .btn-transmute:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(16, 185, 129, 0.6), inset 0 2px 0 rgba(255, 255, 255, 0.3);
        }

        .btn-transmute:hover::before {
            opacity: 1;
        }

        .btn-transmute:active {
            transform: translateY(1px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.1);
        }

        .btn-transmute .material-symbols-outlined {
            font-size: 1.4rem;
        }

        .alchemy-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 3rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
            max-width: 800px;
            text-align: center;
            position: relative;
        }

        .alchemy-panel::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, #10b981, #06b6d4);
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }

        .alchemy-empty-state {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 100%;
        }

        .custom-select-trigger {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            padding: 0.35rem 0.5rem;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 100%;
            min-height: 28px;
        }

        .custom-select-trigger:hover,
        .custom-select-wrapper.open .custom-select-trigger {
            border-color: #10b981;
        }

        .custom-select-options {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            z-index: 100;
            display: none;
            max-height: 300px;
            overflow-y: auto;
        }

        .custom-select-options::-webkit-scrollbar {
            width: 6px;
        }

        .custom-select-options::-webkit-scrollbar-track {
            background: transparent;
            border-radius: 6px;
        }

        .custom-select-options::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
        }

        .custom-select-options::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .custom-select-wrapper.open .custom-select-options {
            display: block;
        }

        .custom-option {
            padding: 0.4rem 0.6rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            transition: background 0.2s ease;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .custom-option:hover {
            background: rgba(16, 185, 129, 0.15);
        }
    </style>
</head>

<body>

    <app-navbar active-page="alchemy"></app-navbar>

    <main style="display: block;">
        <div class="magic-rock"></div>

        <div class="alchemy-main" style="max-width: 1400px; margin: 2rem auto; flex-direction: row; gap: 2rem; align-items: stretch; justify-content: center; height: calc(100vh - 160px);">

            <!-- Left: List of recipes -->
            <div class="panel" style="flex: 1; max-width: 450px; display: flex; flex-direction: column;">
                <div class="panel-title">
                    <span class="material-symbols-outlined" style="color: #a855f7;">menu_book</span>
                    Recettes Alchimique
                </div>

                <div class="filters-container" style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
                    <div style="flex: 1;">
                        <input type="text" id="searchRecipeName" class="form-control" placeholder="Rechercher par nom..." style="margin: 0; padding: 0.6rem; font-size: 0.85rem;" oninput="renderRecipesList()">
                    </div>
                    <div class="custom-select-wrapper" style="flex: 1; z-index: 20;">
                        <div class="custom-select-trigger" style="background: rgba(15,23,42,0.6); padding: 0.6rem; border-radius: 8px;">
                            <span class="cs-label" style="font-size: 0.85rem;">Recettes</span>
                            <span class="material-symbols-outlined" style="color: #64748b; font-size: 1rem;">expand_more</span>
                        </div>
                        <div class="custom-select-options custom-options">
                            <div class="custom-option" data-value="" style="padding: 0.4rem; font-size: 0.85rem;">
                                <span class="material-symbols-outlined cs-icon" style="color: #64748b; font-size: 1rem;">filter_list_off</span> Recettes
                            </div>
                            <div class="custom-option" data-value="GIVE_ANOMALY" style="padding: 0.4rem; font-size: 0.85rem;">
                                <span class="material-symbols-outlined cs-icon" style="color: #a855f7; font-size: 1rem;">star</span> Anomalie
                            </div>
                            <div class="custom-option" data-value="GIVE_CONSUMABLE" style="padding: 0.4rem; font-size: 0.85rem;">
                                <span class="material-symbols-outlined cs-icon" style="color: #10b981; font-size: 1rem;">inventory_2</span> Consommable
                            </div>
                            <div class="custom-option" data-value="GIVE_EQUIPMENT" style="padding: 0.4rem; font-size: 0.85rem;">
                                <span class="material-symbols-outlined cs-icon" style="color: #fbbf24; font-size: 1rem;">shield</span> Equipement
                            </div>
                            <div class="custom-option" data-value="UNLOCK_FEATURE" style="padding: 0.4rem; font-size: 0.85rem;">
                                <span class="material-symbols-outlined cs-icon" style="color: #f59e0b; font-size: 1rem;">key</span> Secret
                            </div>
                            <div class="custom-option" data-value="GIVE_SPIRIT_XP" style="padding: 0.4rem; font-size: 0.85rem;">
                                <span class="material-symbols-outlined cs-icon" style="color: #38bdf8; font-size: 1rem;">self_improvement</span> XP Spiritualité
                            </div>
                        </div>
                        <input type="hidden" id="filterRewardType" value="" onchange="renderRecipesList()">
                    </div>
                </div>
                <div id="playerRecipesList" class="custom-scrollbar" style="display: flex; flex-direction: column; gap: 1rem; flex: 1; overflow-y: auto; padding-right: 0.5rem;">
                    <p style="color: var(--text-muted); text-align: center; margin-top: 2rem;">Chargement du Grimoire
                        Alchimique...</p>
                </div>
            </div>

            <!-- Right: The Cauldron / Crafting Area -->
            <div class="alchemy-panel" style="flex: 2; display: flex; justify-content: center; align-items: center; min-height: 500px;" id="cauldronPanel">
                <div style="text-align: center; color: var(--text-muted);">
                    <span class="material-symbols-outlined" style="font-size: 4rem; color: rgba(16, 185, 129, 0.3);">experiment</span>
                    <p style="margin-top: 1rem;">Sélectionnez une recette dans le grimoire à gauche pour l'étudier.</p>
                </div>
            </div>

        </div>

    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/alchemy.js"></script>
    <script src="/js/components/navbar.js"></script>


</body></html>
