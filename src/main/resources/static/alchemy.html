<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratoire Alchimique - Grimoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Inter:wght@300;400;500&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/variables.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/ui/layout.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/ui/forms.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/ui/components.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/ui/utilities.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/pages/alchemy.css?v=1786180000000">
</head>

<body>

    <app-navbar active-page="alchemy"></app-navbar>

    <main class="block">
        <div class="alchemy-main max-w-[1400px] my-8 mx-auto flex-row gap-8 items-stretch justify-center h-[calc(100vh-160px)]"  
            >

            <!-- Left: List of recipes -->
            <div class="panel flex-1 max-w-[450px] flex flex-col"   >
                <div class="panel-title"  >
                    <span class="material-symbols-outlined text-purple"  >menu_book</span>
                    Recettes Alchimique
                </div>

                <div class="filters-container mb-4 flex gap-2"   >
                    <div class="flex-1"  >
                        <input class="form-control m-0 p-[0.6rem] text-[0.85rem]"  type="text" id="searchRecipeName" 
                            placeholder="Rechercher par nom..." 
                            oninput="renderRecipesList()">
                    </div>
                    <div class="custom-select-wrapper flex-1 z-20"   >
                        <div class="custom-select-trigger"  >
                            <span class="cs-label text-[0.85rem]"   >Recettes</span>
                            <span class="material-symbols-outlined text-slate-500 text-base"  
                                >expand_more</span>
                        </div>
                        <div class="custom-select-options custom-options"  >
                            <div class="custom-option"   data-value="">
                                <span class="material-symbols-outlined cs-icon text-muted"  >filter_list_off</span>
                                Recettes
                            </div>
                            <div class="custom-option"   data-value="GIVE_ANOMALY">
                                <span class="material-symbols-outlined cs-icon text-purple"  >star</span>Anomalie
                            </div>
                            <div class="custom-option"   data-value="GIVE_CONSUMABLE">
                                <span class="material-symbols-outlined cs-icon text-success"  >inventory_2</span>Consommable
                            </div>
                            <div class="custom-option"   data-value="GIVE_EQUIPMENT">
                                <span class="material-symbols-outlined cs-icon text-warning"  >shield</span>Equipement
                            </div>
                            <div class="custom-option"   data-value="UNLOCK_FEATURE">
                                <span class="material-symbols-outlined cs-icon text-warning"  >key</span>Secret
                            </div>
                            <div class="custom-option"   data-value="GIVE_SPIRIT_XP">
                                <span class="material-symbols-outlined cs-icon text-mana"  >self_improvement</span>XP Spiritualité
                            </div>
                        </div>
                        <input type="hidden" id="filterRewardType" value="" onchange="renderRecipesList()">
                    </div>
                </div>
                <div class="custom-scrollbar flex-1 flex flex-col gap-4 overflow-y-auto pr-2"  id="playerRecipesList" 
                    >
                    <p class="text-muted text-center mt-8">Chargement du Grimoire
                        Alchimique...</p>
                </div>
            </div>

            <!-- Right: The Cauldron / Crafting Area -->
            <div class="alchemy-panel flex-2 flex justify-center items-center min-h-[500px]"  
                
                id="cauldronPanel">
                <div class="text-center text-muted">
                    <span class="material-symbols-outlined text-6xl text-emerald-500/30"  
                        >experiment</span>
                    <p class="mt-4" >Sélectionnez une recette dans le grimoire à gauche pour l'étudier.</p>
                </div>
            </div>

        </div>

    </main>

    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script src="/js/alchemy.js"></script>
    <script src="/js/components/navbar.js"></script>


</body>

</html>
