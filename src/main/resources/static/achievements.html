<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Débloquez des succès épiques, accomplissez des exploits et revêtez vos titres les plus prestigieux.">
    <title>Succès - Grimoire</title>
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="/styles/variables.css?v=1786180000006">
    <link rel="stylesheet" href="/styles/ui/layout.css?v=1786180000006">
    <link rel="stylesheet" href="/styles/ui/components.css?v=1786180000040">
    <link rel="stylesheet" href="/styles/ui/utilities.css?v=1786180000010">
    <link rel="stylesheet" href="/styles/pages/achievements.css?v=1786180000030">
    <script src="/js/components/navbar.js?v=1786180000040"></script>
</head>
<body>
    <app-navbar active-page="achievements"></app-navbar>

    <main class="block">
        <div class="achievements-main">
            <!-- Top Header : KPI Progression + Équipement de Titre -->
            <div class="achievements-header">
                <div class="achievements-kpi-card">
                    <div class="kpi-title">
                        <span class="material-symbols-outlined text-warning">emoji_events</span>
                        Progression des Succès
                    </div>
                    <div class="kpi-score-row">
                        <span class="kpi-score-big" id="kpiScore">0</span>
                        <span class="kpi-score-total" id="kpiTotal">/ 0</span>
                    </div>
                    <div class="achievements-progress-track">
                        <div class="achievements-progress-fill" id="kpiProgressBar"></div>
                    </div>
                    <span class="text-xs text-muted" id="kpiPercentage">0% complété</span>
                </div>

                <div class="achievements-title-card">
                    <div class="title-card-title">
                        <span class="material-symbols-outlined text-purple-400">military_tech</span>
                        Titre Actif & Distinctions
                    </div>
                    <div class="active-title-preview">
                        <span class="text-xs text-muted">Affiché en jeu :</span>
                        <span class="title-badge-gold" id="activeTitleBadge">Aucun titre équipé</span>
                    </div>
                    <div class="title-picker-row">
                        <div class="custom-select-wrapper title-custom-select" id="titleSelectWrapper">
                            <div class="custom-select-trigger" id="titleSelectTrigger">
                                <span class="cs-label" id="titleSelectLabel">
                                    <span class="material-symbols-outlined cs-icon text-muted">military_tech</span>
                                    <span>-- Aucun titre --</span>
                                </span>
                                <span class="material-symbols-outlined cs-arrow">expand_more</span>
                            </div>
                            <div class="custom-select-options custom-scrollbar" id="titleSelectOptions">
                                <!-- Options de titres générées dynamiquement -->
                            </div>
                        </div>
                        <button type="button" class="btn-equip-title" onclick="handleEquipTitle()">
                            <span class="material-symbols-outlined text-sm">check</span>
                            Équiper
                        </button>
                    </div>
                </div>
            </div>

            <!-- Filtres par catégorie -->
            <div class="achievements-filters" id="achievementsFilters">
                <!-- Rempli par achievements.js -->
            </div>

            <!-- Grille de cartes de succès -->
            <div class="achievements-grid" id="achievementsGrid">
                <p class="text-muted text-center col-span-full">Chargement de vos succès...</p>
            </div>
        </div>

        <!-- Sidebar droite commune -->
        <aside class="hub-nav-sidebar" aria-label="Navigation profil">
            <div class="hub-tabs-container">
                <a href="/secrets.html" class="hub-tab-btn tab-secrets" title="Mes Secrets">
                    <span class="material-symbols-outlined hub-tab-icon">key</span>
                    <span class="hub-tab-label">Secrets</span>
                </a>
                <a href="/dungeon-stats.html" class="hub-tab-btn tab-stats" title="Statistiques PvE">
                    <span class="material-symbols-outlined hub-tab-icon">insights</span>
                    <span class="hub-tab-label">Stats</span>
                </a>
                <a href="/achievements.html" class="hub-tab-btn tab-achievements active" title="Succès & Titres">
                    <span class="material-symbols-outlined hub-tab-icon">emoji_events</span>
                    <span class="hub-tab-label">Succès</span>
                </a>
            </div>
        </aside>

    </main>
 
     <script src="/js/services/auth.js?v=1786180000010"></script>
     <script defer src="/js/utils/utils.js"></script>
     <script type="module" src="/js/pages/achievements.js?v=1786180000040"></script>
</body>
</html>
