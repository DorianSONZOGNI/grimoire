<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ici, vous pourrez retrouver tout les secrets que vous avez découverts.">
    <title>Mes Secrets - Grimoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Inter:wght@300;400;500&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/variables.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/ui/layout.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/ui/components.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/ui/utilities.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/pages/secrets.css?v=1786180000001">
</head>

<body>

    <app-navbar active-page="secret"></app-navbar>

    <main class="block">
        <div class="secrets-main">
            <div class="secrets-grid" id="secretsGrid">
                <p class="text-muted text-center col-span-full">Chargement de vos
                    secrets...</p>
            </div>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        const DEFAULT_SECRETS_META = [
            { name: "Secret du Chaos", icon: "local_fire_department", color: "#ff0000" },
            { name: "Secret de l'Abondance", icon: "eco", color: "#10b981" },
            { name: "Secret de la Préservation", icon: "foundation", color: "#99674c" },
            { name: "Secret de la Sérénité", icon: "water_drop", color: "#00e5cc" },
            { name: "Secret de la Chasse", icon: "visibility_off", color: "#ed5677" },
            { name: "Secret du Carnage", icon: "explosion", color: "#a70740" },
            { name: "Secret de la Joie", icon: "volcano", color: "#b74c0b" },
            { name: "Secret du Savoir", icon: "psychology", color: "#3b82f6" },
            { name: "Secret du Destin", icon: "all_inclusive", color: "#e7d198" },
            { name: "Secret de l'Éther", icon: "blur_on", color: "#38bdf8" },
            { name: "Secret des Abysses", icon: "dark_mode", color: "#c084fc" }
        ];

        window.addEventListener('authLoaded', () => {
            const secretAudio = new Audio('/sons/secret.mp3');
            secretAudio.play().catch(e => console.log("Autoplay bloqué par le navigateur :", e));

            if (!window.currentUser) {
                document.getElementById('secretsGrid').innerHTML = '<p class="text-red-500 text-center col-span-full">Veuillez vous connecter pour voir vos secrets.</p>';
                return;
            }

            renderSecrets();
        });

        function renderSecrets() {
            const grid = document.getElementById('secretsGrid');
            const secrets = window.currentUser.unlockedSecrets || {};
            const secretNames = Object.keys(secrets);

            if (secretNames.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center p-12 bg-black/30 rounded-xl border border-dashed border-white/10">
                        <span class="material-symbols-outlined mb-4 text-[3rem] text-slate-500"   >key_off</span>
                        <h3 class="mb-2 text-slate-300" >Aucun secret dévoilé</h3>
                        <p class="text-muted text-sm">Pratiquez l'alchimie pour percer les mystères de ce monde.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = '';

            // Sort secrets alphabetically
            secretNames.sort((a, b) => a.localeCompare(b));

            secretNames.forEach(name => {
                const level = secrets[name];
                const meta = DEFAULT_SECRETS_META.find(s => s.name.toLowerCase() === name.toLowerCase())
                    || { icon: "key", color: "#f59e0b" };

                const card = document.createElement('div');
                card.className = 'secret-card';
                card.style.setProperty('--secret-color', meta.color);

                card.innerHTML = `
                    <div class="secret-icon"  >
                        <span class="material-symbols-outlined text-[3rem]"   >${meta.icon}</span>
                    </div>
                    <div class="flex flex-col gap-2 items-center">
                        <h3 class="secret-name"  >${name}</h3>
                        <span class="secret-level"  >Niveau ${level}</span>
                    </div>
                `;

                grid.appendChild(card);
            });
        }
    </script>
    <script src="/js/components/navbar.js"></script>


</body>

</html>
