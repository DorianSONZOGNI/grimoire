<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tableau de Chasse — Relevez les défis journaliers et hebdomadaires pour gagner des récompenses.">
    <title>Grimoire - Tableau de Chasse</title>
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="/styles/variables.css?v=1786180000002">
    <link rel="stylesheet" href="/styles/ui/layout.css?v=1786180000002">
    <link rel="stylesheet" href="/styles/ui/forms.css?v=1786180000002">
    <link rel="stylesheet" href="/styles/ui/components.css?v=1786180000002">
    <link rel="stylesheet" href="/styles/ui/utilities.css?v=1786180000002">
    <link rel="stylesheet" href="/styles/pages/hunting.css?v=1786180000002">
</head>

<body>

    <app-navbar active-page="hunting"></app-navbar>

    <main class="hunting-container w-full max-w-[1200px] mx-auto p-8">

        <div class="flex items-center gap-4 mb-2">
            <h2 class="font-outfit text-[2rem] m-0 leading-none">
                <span class="logo-text-gradient logo-hunting">Tableau de Chasse</span>
            </h2>
        </div>
        <p class="text-muted mb-8">Relevez les défis pour grimper dans le classement et remporter des récompenses.</p>

        <!-- ═══════ DAILY ═══════ -->
        <section class="quest-section" id="dailySection">
            <div class="quest-header">
                <span class="quest-badge daily">
                    <span class="material-symbols-outlined">today</span>
                    Défi Journalier
                </span>
                <span class="quest-timer" id="dailyTimer"></span>
            </div>

            <div class="quest-card" id="dailyCard">
                <div class="quest-card-loading">
                    <span class="material-symbols-outlined spin">progress_activity</span>
                    Chargement…
                </div>
            </div>
        </section>

        <!-- ═══════ WEEKLY ═══════ -->
        <section class="quest-section" id="weeklySection">
            <div class="quest-header">
                <span class="quest-badge weekly">
                    <span class="material-symbols-outlined">date_range</span>
                    Défi Hebdomadaire
                </span>
                <span class="quest-timer" id="weeklyTimer"></span>
            </div>

            <div class="quest-card" id="weeklyCard">
                <div class="quest-card-loading">
                    <span class="material-symbols-outlined spin">progress_activity</span>
                    Chargement…
                </div>
            </div>
        </section>

        <!-- ═══════ PREVIOUS WEEKLY (if claimable) ═══════ -->
        <section class="quest-section" id="previousWeeklySection" style="display: none;">
            <div class="quest-header">
                <span class="quest-badge weekly faded">
                    <span class="material-symbols-outlined">history</span>
                    Défi Hebdo Précédent
                </span>
                <span class="text-muted text-sm">Récompense encore récupérable</span>
            </div>

            <div class="quest-card" id="previousWeeklyCard"></div>
        </section>

    </main>

    <script src="/js/utils/utils.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script src="/js/services/auth.js"></script>
    <script src="/js/components/navbar.js"></script>
    <script src="/js/pages/hunting.js?v=2"></script>

</body>
</html>
