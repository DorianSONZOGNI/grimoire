<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Grimoire</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <link rel="stylesheet" href="/styles/variables.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/ui/components.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/ui/utilities.css?v=1786180000000">
    <link rel="stylesheet" href="/styles/pages/login.css?v=1786180000000">
</head>

<body>
    <div class="ambient-light"></div>
    <div class="ambient-light-2"></div>

    <div class="auth-container">
        <div class="auth-header">
            <div class="auth-logo">
                <span class="material-symbols-outlined">auto_stories</span>
                Grimoire
            </div>
            <div class="auth-subtitle">Accéder à votre sauvegarde et vos personnages</div>
        </div>

        <div class="auth-error" id="authError"></div>

        <form class="auth-form" id="loginForm">
            <div class="auth-field">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="auth-field">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button class="auth-btn" type="submit">Se connecter</button>
        </form>

        <div class="auth-footer">
            Nouveau ici ? <a href="/register.html">Créer un compte</a>
        </div>
    </div>

    <script type="module" src="/js/auth.js"></script>
</body>

</html>
