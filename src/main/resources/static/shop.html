<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Boutique du Grimoire, ici, vous pourrez retrouver chaque jour des objets différents disponibles à l'achat.">
    <title>Grimoire - Boutique</title>
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

    <link rel="stylesheet" href="/styles/variables.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/ui/components.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/ui/utilities.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/ui/equipment.css?v=1786180000001">
    <link rel="stylesheet" href="/styles/pages/shop.css?v=1786180000001">

    <noscript>
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    </noscript>

    <script defer src="/js/utils.js"></script>
    <script type="module" src="/js/ui.js"></script>
    <script defer src="/js/shop.js?v=99"></script>
    <script type="module" src="/js/auth.js?v=10"></script>
    <script defer src="/js/components/navbar.js"></script>
    <script defer src="/js/components/loader.js"></script>
</head>

<body>
    <app-navbar active-page="shop"></app-navbar>

    <div class="vault-main">
        <div class="panel">
            <div class="page-header mb-2">
                <div class="page-header-content">
                    <div class="page-header-icon success">
                        <span class="material-symbols-outlined text-[1.8rem]">storefront</span>
                    </div>
                    <div>
                        <h2 class="page-header-title">Boutique du Jour</h2>
                        <div class="page-header-subtitle">Ces objets changent tous les jours à minuit.</div>
                    </div>
                </div>
            </div>

            <div class="shop-showcase" id="shopGrid">
                <app-loader message="Chargement de la boutique..."></app-loader>
            </div>

            <div class="page-header mt-1 mb-2">
                <div class="page-header-content">
                    <div class="page-header-icon warning">
                        <span class="material-symbols-outlined text-[1.8rem]">local_offer</span>
                    </div>
                    <div>
                        <h2 class="page-header-title">Offres Spéciales &amp; Consomables</h2>
                        <div class="page-header-subtitle">Promotions et objets utiles pour les expéditions.</div>
                    </div>
                </div>
            </div>

            <div class="shop-showcase" id="specialsGrid">
                <app-loader message="Chargement des offres..."></app-loader>
            </div>
        </div>
    </div>

    <!-- Buy Confirmation Modal -->
</body>

</html>
