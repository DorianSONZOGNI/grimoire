<!DOCTYPE html><html lang="fr"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grimoire - Boutique</title>
    <link rel="icon" type="image/png" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;family=Inter:wght@300;400;500&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <link rel="stylesheet" href="/styles/variables.css">
    <link rel="stylesheet" href="/styles/ui/components.css">
    <link rel="stylesheet" href="/styles/ui/utilities.css">
    <link rel="stylesheet" href="/styles/pages/vault.css?v=3">
    <style>
        .shop-showcase {
            display: flex !important;
            flex-direction: row !important;
            justify-content: flex-start !important;
            /* Ensures scroll works left-to-right */
            align-items: stretch !important;
            gap: 0.5rem;
            margin-top: 1rem;
            width: 100%;
            overflow-x: auto;
            padding-top: 1.5rem;
            /* Prevents absolutely positioned top labels from being cropped */
            padding-bottom: 1.5rem;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            flex-wrap: nowrap !important;
            -webkit-overflow-scrolling: touch;
        }

        .shop-rarity-group {
            display: flex;
            flex-direction: row;
            gap: 2rem;
            position: relative;
            padding: 1.5rem 0.75rem;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            /* Prevents group from shrinking or wrapping its children */
            transition: z-index 0.2s;
        }

        .shop-rarity-group:hover {
            z-index: 50;
        }

        .shop-rarity-group.group-COMMUN {
            border-top: 3px solid #94a3b8;
        }

        .shop-rarity-title {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: #0f172a;
            padding: 0 1rem;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            white-space: nowrap;
        }

        .group-COMMUN .shop-rarity-title {
            color: #94a3b8;
            border-color: rgba(148, 163, 184, 0.3);
        }

        .shop-rarity-group.group-INHABITUEL {
            border-top: 3px solid #22c55e;
        }

        .group-INHABITUEL .shop-rarity-title {
            color: #22c55e;
            border-color: rgba(34, 197, 94, 0.3);
        }

        .shop-rarity-group.group-RARE {
            border-top: 3px solid #3b82f6;
        }

        .group-RARE .shop-rarity-title {
            color: #3b82f6;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .shop-rarity-group.group-MYTHIQUE {
            border-top: 3px solid #f97316;
        }

        .group-MYTHIQUE .shop-rarity-title {
            color: #f97316;
            border-color: rgba(249, 115, 22, 0.3);
        }

        .shop-rarity-group.group-LEGENDAIRE {
            border-top: 3px solid #f59e0b;
        }

        .group-LEGENDAIRE .shop-rarity-title {
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .shop-rarity-group.group-EPIQUE {
            border-top: 3px solid #ef4444;
        }

        .group-EPIQUE .shop-rarity-title {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .shop-rarity-group.group-RELIQUE {
            border-top: 3px solid #a855f7;
        }

        .group-RELIQUE .shop-rarity-title {
            color: #a855f7;
            border-color: rgba(168, 85, 247, 0.3);
        }

        .shop-rarity-group.group-MAUDIT {
            border-top: 3px solid #6b5252;
        }

        .group-MAUDIT .shop-rarity-title {
            color: #9e8b8b;
            border-color: rgba(107, 82, 82, 0.3);
        }

        .shop-stand {
            flex: 0 0 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            position: relative;
        }

        .shop-stand:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            z-index: 50;
        }

        .flip-icon {
            transform: scaleX(-1);
            display: inline-block;
            transform: rotate(180deg) !important;
        }

        .shop-stand-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        .shop-stand-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: #f8fafc;
            margin-bottom: 0.5rem;
            line-height: 1.2;
            height: 2.6rem;
            /* 2 lines max */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .shop-stand-stats {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            width: 100%;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .shop-stand-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #cbd5e1;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
        }

        .shop-stand-stat.malus {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .shop-stand-price {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.3rem;
            font-weight: bold;
            color: #f59e0b;
            font-size: 1.1rem;
            padding: 0.6rem;
            border-radius: 8px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            cursor: pointer;
            transition: all 0.2s;
            margin-top: auto;
        }

        .shop-stand-price:hover {
            background: #f59e0b;
            color: #fff;
        }
    </style>
</head>

<body>
    <app-navbar active-page="shop"></app-navbar>

    <div class="vault-main">
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); display: flex; align-items: center; justify-content: center; color: #10b981;">
                        <span class="material-symbols-outlined" style="font-size: 1.8rem;">storefront</span>
                    </div>
                    <div>
                        <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 1.5rem;">Boutique du Jour
                        </h2>
                        <div style="color: #94a3b8; font-size: 0.9rem;">Ces objets changent tous les jours à minuit.
                        </div>
                    </div>
                </div>
            </div>

            <div id="shopGrid" class="shop-showcase">
                <div style="color: #94a3b8; font-style: italic;">Chargement de la boutique...</div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 3rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--glass-border); padding-bottom: 1rem;">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); display: flex; align-items: center; justify-content: center; color: #f59e0b;">
                        <span class="material-symbols-outlined" style="font-size: 1.8rem;">local_offer</span>
                    </div>
                    <div>
                        <h2 style="margin: 0; font-family: 'Outfit', sans-serif; font-size: 1.5rem;">Offres Spéciales &amp;
                            Consomables</h2>
                        <div style="color: #94a3b8; font-size: 0.9rem;">Promotions et objets utiles pour les
                            expéditions.</div>
                    </div>
                </div>
            </div>

            <div id="specialsGrid" class="shop-showcase">
                <div style="color: #94a3b8; font-style: italic;">Chargement des offres...</div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="shopNotif" style="position: fixed; bottom: 2rem; right: 2rem; background: #10b981; color: #fff; padding: 1rem 2rem; border-radius: 12px; font-weight: 500; font-family: 'Outfit', sans-serif; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3); transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 9999;">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <span class="material-symbols-outlined" style="font-size: 1.2rem;">check_circle</span>
            <span id="shopNotifText">Action réussie</span>
        </div>
    </div>

    <!-- Buy Confirmation Modal -->
    

    <script>
        window.addEventListener('authLoaded', () => {
            if (!window.currentUser) {
                document.querySelector('.vault-main').style.display = 'none';
                document.querySelector('.vault-main').insertAdjacentHTML('beforebegin', `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; color: white;">
                        <span class="material-symbols-outlined" style="font-size: 4rem; color: #ef4444; margin-bottom: 1rem;">lock</span>
                        <h1 style="font-size: 2rem; margin-bottom: 1rem; font-family: 'Outfit', sans-serif;">Veuillez vous connecter</h1>
                        <p style="color: #94a3b8; max-width: 400px; margin-bottom: 2rem; font-size: 1.1rem;">
                            Vous devez être connecté pour accéder à cette page.
                        </p>
                    </div>
                `);
            } else if (!window.currentUser.unlockedShop) {
                document.querySelector('.vault-main').style.display = 'none';
                document.querySelector('.vault-main').insertAdjacentHTML('beforebegin', `
                    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; text-align: center; color: white;">
                        <span class="material-symbols-outlined" style="font-size: 4rem; color: #ef4444; margin-bottom: 1rem;">lock</span>
                        <h1 style="font-size: 2rem; margin-bottom: 1rem; font-family: 'Outfit', sans-serif;">Boutique Bloquée</h1>
                        <p style="color: #94a3b8; max-width: 400px; margin-bottom: 2rem; font-size: 1.1rem;">
                            Vous devez débloquer la Boutique pour y accéder. L'accès coûte 75 or.
                        </p>
                        <button onclick="promptUnlockFeature('shop', 'Boutique', 75)" style="background: #10b981; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 8px; font-weight: 600; font-family: 'Outfit', sans-serif; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); transition: all 0.2s;">
                            Débloquer pour 75 <span class="material-symbols-outlined" style="font-size: 1.2rem; vertical-align: middle; color: #fcd34d;">monetization_on</span>
                        </button>
                    </div>
                `);
            }
        });
    </script>
    <script src="/js/utils.js"></script>
    <script src="/js/shop.js?v=99"></script>
    <script type="module" src="/js/auth.js?v=10"></script>
    <script src="/js/components/navbar.js"></script>


</body></html>
